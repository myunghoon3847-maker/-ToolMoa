<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초간단 이미지 변환기 | ToolMoa</title>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .tool-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        input[type="file"], select, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="tool-container">
        <h1>이미지 포맷 변환기 🔄</h1>
        <p>서버 저장 없이 브라우저에서 안전하게 변환됩니다.</p>

        <!-- 1. 파일 선택 -->
        <input type="file" id="imageInput" accept="image/*">

        <!-- 2. 변환할 포맷 선택 -->
        <select id="formatSelect">
            <option value="image/jpeg">JPG로 변환</option>
            <option value="image/png">PNG로 변환</option>
            <option value="image/webp">WEBP로 변환 (추천)</option>
        </select>

        <!-- 3. 변환 버튼 -->
        <button id="convertBtn">변환 및 다운로드</button>

        <!-- 변환 처리를 위한 숨겨진 캔버스 -->
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const formatSelect = document.getElementById('formatSelect');
        const convertBtn = document.getElementById('convertBtn');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        convertBtn.addEventListener('click', () => {
            // 파일이 선택되었는지 확인
            if (!imageInput.files[0]) {
                alert('변환할 이미지를 먼저 선택해주세요!');
                return;
            }

            const file = imageInput.files[0];
            const reader = new FileReader();

            // 파일을 읽은 후 실행될 로직
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // 캔버스 크기를 원본 이미지 크기와 동일하게 설정
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    // 캔버스에 이미지 그리기
                    ctx.drawImage(img, 0, 0);

                    // 선택한 포맷으로 변환 (품질은 0.9로 설정)
                    const format = formatSelect.value;
                    const extension = format.split('/')[1]; 
                    const newDataUrl = canvas.toDataURL(format, 0.9);

                    // 다운로드 링크 생성 및 자동 클릭
                    const link = document.createElement('a');
                    link.download = `ToolMoa_converted.${extension}`;
                    link.href = newDataUrl;
                    link.click();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });
    </script>

</body>
</html>
